# grype config for the DEV audit (scripts/audit.sh --scope dev): every conda package in the
# default env that is NOT in audit/binary-packages.txt -- the build toolchain (cmake, clang, ...),
# its transitive deps, and libraries the binary never links. Nothing here ships to users.
# Each entry pins vulnerability + package { name, version, type }: a rebuilt or upgraded package,
# or a new CVE, alerts again. Remove entries once conda-forge ships a fixed build and the lock moves.
# Passed with an explicit -c, which also stops grype from picking up ./.grype.yaml or ~/.grype.yaml.
#
# 2026-10-19 (first scheduled audit, run 39240423507): libssh2 1.11.1 and krb5 1.22.2 are in the env
# only as deps of the conda libcurl package (pixi tree -i), which cmake needs and which this project
# uses for curl/curl.h alone: the binary never links libcurl, it dlopen()s the host's libcurl.so.4,
# so neither package's code is in the artifact. No fixed conda-forge build existed (pixi search).
# The two CVE-2007-* krb5 matches are CPE-heuristic matches of 2007 CVEs against krb5 1.22.2.
ignore:
  - vulnerability: CVE-2007-3149 # High
    package: { name: krb5, version: "1.22.2", type: binary }
    reason: "build env only (libcurl dep for cmake + headers), not in the release binary; reviewed 2026-10-19"
  - vulnerability: CVE-2007-5894 # High
    package: { name: krb5, version: "1.22.2", type: binary }
    reason: "build env only (libcurl dep for cmake + headers), not in the release binary; reviewed 2026-10-19"
